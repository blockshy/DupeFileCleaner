name: Release

# 发布只接受显式的稳定版本标签；手动执行也必须指向已经存在的标签。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的稳定版本标签，例如 v1.1.1
        required: true
        type: string

permissions:
  contents: read

# 同一标签的发布串行执行，避免两个任务同时创建或修改草稿。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release commit
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: ./tool/release_metadata.ps1 -Tag $env:RELEASE_TAG

  checks:
    name: Check release source
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      checkout-ref: ${{ needs.metadata.outputs.commit }}

  package:
    name: Build Windows package
    needs: [metadata, checks]
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - name: Checkout checked commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false

      - name: Confirm tag and prepare release notes
        run: ./tool/release_metadata.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_COMMIT -NotesFile dist/release-notes.md

      - name: Restore locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw '无法按锁文件恢复依赖。' }

      - name: Build and verify archive
        run: |
          ./tool/build_windows.ps1 -VersionTag $env:RELEASE_TAG -OutputDirectory dist
          ./tool/verify_release_package.ps1 -Tag $env:RELEASE_TAG -ArtifactDirectory dist

      # 只在同一工作流内传递明确命名的归档与说明，不上传整个工作目录或测试日志。
      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.metadata.outputs.tag }}
          path: |
            dist/DupeFileCleaner-${{ needs.metadata.outputs.tag }}-windows-x64.zip
            dist/DupeFileCleaner-${{ needs.metadata.outputs.tag }}-windows-x64.zip.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified release
    needs: [metadata, package]
    runs-on: windows-2022
    timeout-minutes: 15
    # 仅此任务需要写入 Release；构建和执行测试时没有仓库写权限。
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout publishing helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.metadata.outputs.tag }}
          path: release-artifacts

      - name: Recheck tag and publish
        shell: pwsh
        run: |
          ./tool/release_metadata.ps1 -Tag $env:RELEASE_TAG -ExpectedCommit $env:RELEASE_COMMIT -NotesFile build/confirmed-release-notes.md
          ./tool/publish_release.ps1 -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Repository $env:GH_REPO -ArtifactDirectory release-artifacts -NotesFile build/confirmed-release-notes.md

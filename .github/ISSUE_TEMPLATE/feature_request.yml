name: 功能建议
description: 描述希望解决的问题和使用场景。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的功能或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方法
